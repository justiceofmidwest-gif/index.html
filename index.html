<style>
body { font-family: -apple-system,BlinkMacSystemFont,sans-serif; text-align:center; padding:30px 15px; background:#fafafa;}
h1 { font-size:24px;}
.intro { font-size:16px; margin-top:10px; color:#444;}
button { margin-top:20px; font-size:18px; padding:12px 24px; border-radius:8px; border:none; background:#222; color:#fff;}
.result { margin-top:30px;}
.shuffle { font-size:18px; color:#999;}
.name { font-size:22px; font-weight:bold; margin-top:10px;}
.desc { margin-top:10px; font-size:16px; line-height:1.6;}
.thanks { margin-top:20px; font-size:14px; color:#666;}
footer { margin-top:40px; font-size:12px; color:#999; line-height:1.6;}
.share-buttons { margin-top:30px;}
.share-buttons button { margin:5px; color:#fff; }
.share-x { background:#1da1f2; }
.share-facebook { background:#1877f2; }
.share-line { background:#00c300; }
</style>

<script>
// URL統一（index.html消す）
if (location.pathname.endsWith("/index.html")) {
  location.replace(location.origin + "/");
}

// おみくじデータ
const omikuji = [
  { name: "金脈（きんみゃく）", desc: "金運が良い、富の源泉を見つける" },
  { name: "人脈（じんみゃく）", desc: "素敵なご縁に恵まれる、助け合える仲間ができる" },
  { name: "脈々（みゃくみゃく）", desc: "大切な伝統や想いを受け継ぎ、次へ繋げる" },
  { name: "脈拍（みゃくはく）", desc: "心身ともに健康で、リズムが安定している" },
  { name: "脈絡（みゃくらく）", desc: "物事の筋道が見え、賢明な判断ができる" },
  { name: "山脈（さんみゃく）", desc: "大きな志を持ち、さらなる高みへ到達できる" },
  { name: "水脈（すいみゃく）", desc: "知恵やアイデアが枯れることなく湧き出し続ける" },
  { name: "気脈（きみゃく）", desc: "周囲の人と心が通じ合い、最高の連携が取れる" },
  { name: "地脈（ちみゃく）", desc: "場所や環境のエネルギーを味方につけ、安定する" },
  { name: "鉱脈（こうみゃく）", desc: "自分の中に眠っていた新しい才能や宝を発見する" },
  { name: "脈あり（みゃくあり）", desc: "期待していたことに光が差し、願いが叶う兆し" },
  { name: "ミャクミャク", desc: "変化を楽しみながら、生命力あふれる未来を切り拓く" }
];

// くじを引く関数
function draw() {
  const today = new Date().toDateString();
  const savedDate = localStorage.getItem("omikuji-date");

  if (savedDate === today) {
    const savedResult = JSON.parse(localStorage.getItem("omikuji-result"));
    show(savedResult);
    return;
  }

  document.getElementById("status").innerText = "……シャッフル中……";
  document.getElementById("name").innerText = "";
  document.getElementById("desc").innerText = "";
  document.getElementById("thanks").innerText = "";

  setTimeout(() => {
    const result = omikuji[Math.floor(Math.random() * omikuji.length)];
    localStorage.setItem("omikuji-date", today);
    localStorage.setItem("omikuji-result", JSON.stringify(result));
    show(result);
  }, 1200);
}

// 結果表示
function show(r) {
  document.getElementById("status").innerText = "";
  document.getElementById("name").innerText = r.name;
  document.getElementById("desc").innerText = r.desc;
  document.getElementById("thanks").innerText = "ありがとう！また明日も来てね 🌱";
}

// SNSシェア関数
function shareX() {
  const url = encodeURIComponent(window.location.href);
  const text = encodeURIComponent("今日の運勢をチェック！ #みゃくみゃくじ");
  window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, "_blank");
}

function shareFacebook() {
  const url = encodeURIComponent(window.location.href);
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${url}`, "_blank");
}

function shareLINE() {
  const url = encodeURIComponent(window.location.href);
  window.open(`https://social-plugins.line.me/lineit/share?url=${url}`, "_blank");
}
</script>
</head>

<body>
<h1>みゃくみゃくじ</h1>
<div class="intro">
  12の「脈」から、今日のあなたに流れている運をひとつ授けます。
</div>

<button onclick="draw()">くじを引く</button>

<div class="result">
  <div id="status" class="shuffle"></div>
  <div id="name" class="name"></div>
  <div id="desc" class="desc"></div>
  <div id="thanks" class="thanks"></div>
</div>

<div class="share-buttons">
  <button class="share-x" onclick="shareX()">Xでシェア</button>
  <button class="share-facebook" onclick="shareFacebook()">Facebookでシェア</button>
  <button class="share-line" onclick="shareLINE()">LINEでシェア</button>
</div>
