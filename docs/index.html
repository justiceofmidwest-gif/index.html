<style>

<script>
// index.html を消す
if (location.pathname.endsWith("/index.html")) {
  location.replace(location.origin + "/");
}

// おみくじデータ（丁寧語）
const omikuji = [
  { name: "金脈（きんみゃく）", desc: "金運が良く、富の源泉を見つけられるでしょう。" },
  { name: "人脈（じんみゃく）", desc: "素敵なご縁に恵まれ、助け合える仲間ができるでしょう。" },
  { name: "脈々（みゃくみゃく）", desc: "大切な伝統や想いを受け継ぎ、次へと繋げられるでしょう。" },
  { name: "脈拍（みゃくはく）", desc: "心身ともに健康で、リズムが安定するでしょう。" },
  { name: "脈絡（みゃくらく）", desc: "物事の筋道が見え、賢明な判断ができるでしょう。" },
  { name: "山脈（さんみゃく）", desc: "大きな志を持ち、さらなる高みへ到達できるでしょう。" },
  { name: "水脈（すいみゃく）", desc: "知恵やアイデアが枯れることなく湧き出し続けるでしょう。" },
  { name: "気脈（きみゃく）", desc: "周囲の人と心が通じ合い、最高の連携が取れるでしょう。" },
  { name: "地脈（ちみゃく）", desc: "場所や環境のエネルギーを味方につけ、安定するでしょう。" },
  { name: "鉱脈（こうみゃく）", desc: "自分の中に眠っていた新しい才能や宝を発見するでしょう。" },
  { name: "脈あり（みゃくあり）", desc: "期待していたことに光が差し、願いが叶う兆しがあるでしょう。" },
  { name: "ミャクミャク", desc: "変化を楽しみながら、生命力あふれる未来を切り拓くことができるでしょう。" }
];

function draw() {
  const today = new Date().toDateString();
  const savedDate = localStorage.getItem("omikuji-date");

  if (savedDate === today) {
    show(JSON.parse(localStorage.getItem("omikuji-result")));
    return;
  }

  document.getElementById("status").innerText = "……シャッフル中……";
  document.getElementById("name").innerText = "";
  document.getElementById("desc").innerText = "";
  document.getElementById("thanks").innerText = "";

  setTimeout(() => {
    const result = omikuji[Math.floor(Math.random() * omikuji.length)];
    localStorage.setItem("omikuji-date", today);
    localStorage.setItem("omikuji-result", JSON.stringify(result));
    show(result);
  }, 1200);
}

function show(r) {
  document.getElementById("status").innerText = "";
  document.getElementById("name").innerText = r.name;
  document.getElementById("desc").innerText = r.desc;
  document.getElementById("thanks").innerText = "ありがとう！また明日も来てね 🌱";
}

// シェア
function shareX() {
  const url = encodeURIComponent(location.href);
  const text = encodeURIComponent("今日の運勢をチェック！ #みゃくみゃくじ");
  window.open(`https://twitter.com/intent/tweet?url=${url}&text=${text}`, "_blank");
}

function shareFacebook() {
  window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`, "_blank");
}

function shareLINE() {
  window.open(`https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}`, "_blank");
}
</script>

<body>

<h1>みゃくみゃくじ</h1>

<div class="intro">

</div>

<button onclick="draw()">くじを引く</button>

<div class="result">
  <div id="status" class="shuffle"></div>
  <div id="name" class="name"></div>
  <div id="desc" class="desc"></div>
  <div id="thanks" class="thanks"></div>
</div>

<div class="share-message">
  良ければ皆さんにシェアをお願いします。<br>
  さらに運気が上がることでしょう。
</div>

<div class="share-buttons">
  <button class="share-x" onclick="shareX()">Xでシェア</button>
  <button class="share-facebook" onclick="shareFacebook()">Facebookでシェア</button>
  <button class="share-line" onclick="shareLINE()">LINEでシェア</button>
</div>
